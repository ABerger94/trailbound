<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
<title>Trailbound</title>
<style>
  :root{
    --ink:#e9f1ff; --bg:#0b1020;
    /* GBC palette */
    --gbc-aqua:#54C9C1; --gbc-aqua-dark:#3CA79F; --gbc-aqua-light:#7EDDD7;
    --gbc-bezel:#0b0b0b; --gbc-screen:#222; --gbc-shadow:rgba(0,0,0,.45);
    /* GBA palette */
    --gba-body1:#5860A3; --gba-body2:#3F447D; --gba-body3:#2B2E57;
    /* Buttons */
    --btnA:#6C38FF; --btnB:#FF3B5C; --btnStart:#4a4a4a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Cantarell,"Helvetica Neue",Arial;
    overscroll-behavior:none; -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}

  /* ===== Shared topbar ===== */
  .topbar{display:flex;align-items:center;justify-content:space-between;
    font-weight:800;letter-spacing:.08em;margin-bottom:10px;color:#dfe8ff}
  .topbar .power{display:flex;gap:6px;align-items:center;color:#ddd;font-size:12px}
  .topbar .led{width:10px;height:10px;border-radius:999px;
    background:radial-gradient(circle at 30% 30%,#f66,#a11414);
    box-shadow:0 0 10px #f33,inset 0 0 2px #fff}

  /* ===== GBC Portrait Shell ===== */
  .gbc-shell{
    max-width:min(920px,96vw);
    margin:14px auto;
    padding:18px 18px 24px;
    background:linear-gradient(160deg,var(--gbc-aqua-light),var(--gbc-aqua) 40%,var(--gbc-aqua-dark) 100%);
    border-radius:22px;
    box-shadow:0 18px 36px var(--gbc-shadow), inset 0 6px 0 rgba(255,255,255,.08), inset 0 -6px 0 rgba(0,0,0,.12);
    border:2px solid rgba(0,0,0,.2);
  }
  .gbc-face{
    background:linear-gradient(180deg,#1b1b1b,#111);
    border-radius:16px; padding:16px;
    box-shadow:inset 0 6px 14px rgba(0,0,0,.55);
    color:#dfe8ff;
  }
  .gb-screen{
    background:var(--gbc-bezel); border-radius:14px; padding:14px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.05), inset 0 0 24px rgba(0,0,0,.8);
  }
  #canvasBox{background:var(--gbc-screen); border:1px solid rgba(255,255,255,.06); border-radius:10px; box-shadow: inset 0 0 24px rgba(0,0,0,.65); overflow:hidden}
  #game{display:block; width:100%; height:auto; image-rendering:pixelated; background:#20314f; touch-action:none;}
  .gb-screen::after{
    content:""; display:block; width:120px; height:40px; margin:10px 0 0 auto;
    background:
      radial-gradient(circle at 6px 6px, rgba(0,0,0,.8) 3px, transparent 4px) 0 0/16px 16px,
      radial-gradient(circle at 14px 14px, rgba(0,0,0,.8) 3px, transparent 4px) 0 0/16px 16px;
    opacity:.45; filter:drop-shadow(0 1px 0 rgba(255,255,255,.05)); border-radius:6px;
  }

  /* Portrait controls */
  #mobileControls{
    display:grid;
    grid-template-columns: 160px 1fr 160px;
    grid-template-rows: auto auto;
    gap:12px;
    background:linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.15));
    border:1px solid rgba(255,255,255,.06); border-radius:14px;
    box-shadow: inset 0 8px 22px rgba(0,0,0,.5), 0 10px 22px rgba(0,0,0,.35);
    padding:16px; margin-top:12px;
  }
  .joybase{grid-column:1; grid-row:1 / span 2; width:160px; height:160px; position:relative;
        background:#0e0e14; border:1px solid #232323; border-radius:999px; box-shadow:inset 0 8px 18px rgba(0,0,0,.65);
        touch-action:none; cursor:pointer}
  .joybase::before{content:""; position:absolute; inset:14px; border-radius:999px;
        border:1px dashed rgba(152,164,185,.28)}
  .joynub{position:absolute; left:50%; top:50%; width:64px; height:64px; border-radius:999px;
        transform:translate(-50%,-50%);
        background:radial-gradient(circle at 35% 30%, #3a3f52, #171a24 70%);
        border:1px solid #2a2e3d; box-shadow:0 6px 14px rgba(0,0,0,.5), inset 0 2px 4px rgba(255,255,255,.12);
        pointer-events:none}
  .joybase.active{box-shadow:inset 0 8px 18px rgba(0,0,0,.65), 0 0 0 2px rgba(122,162,255,.35)}
  .joybase.active .joynub{filter:brightness(1.35)}

  .actCluster{grid-column:3; grid-row:1; width:140px; height:120px; position:relative; margin:auto}
  .actCluster .btn{position:absolute; width:56px; height:56px; border-radius:999px; border:1px solid #1b2a52; color:#e9f1ff; font-weight:800; font-size:16px; box-shadow:inset 0 8px 18px rgba(0,0,0,.45); touch-action:manipulation}
  #btnA{background:var(--btnA); right:6px; top:8px}
  #btnB{background:var(--btnB); left:16px; bottom:6px}
  .startRow{grid-column:3; grid-row:2; display:flex; justify-content:center; gap:12px; align-items:center}
  .startRow .tiny{min-width:auto; width:72px; height:32px; border-radius:999px; background:var(--btnStart); border:1px solid #222; color:white; font-weight:800; letter-spacing:.06em; font-size:12px; touch-action:manipulation}

  /* ===== GBA Landscape Shell ===== */
  .gba-shell{ display:none; }
  .gba-body{
    width:min(98vw,1200px);
    margin:10px auto;
    padding:18px;
    border-radius:42px;
    background:linear-gradient(160deg,var(--gba-body1),var(--gba-body2) 55%,var(--gba-body3));
    box-shadow: 0 20px 40px rgba(0,0,0,.55), inset 0 12px 22px rgba(255,255,255,.08), inset 0 -14px 28px rgba(0,0,0,.35);
    border:2px solid rgba(0,0,0,.28);
  }
  .gba-topbar{margin-bottom:12px;}
  .gba-tray{
    background:rgba(0,0,0,.18);
    border-radius:28px;
    padding:14px;
    box-shadow: inset 0 8px 24px rgba(0,0,0,.45), inset 0 -6px 18px rgba(255,255,255,.05);
  }
  #landscapeRow{
    display:grid;
    grid-template-columns: 172px 1fr 160px;
    gap:14px;
    align-items:center;
  }

  .joybase.land-joy{ width:172px; height:172px; position:relative; margin:auto;
              background:#0e0e14; border:1px solid #232323; border-radius:999px; box-shadow:inset 0 8px 18px rgba(0,0,0,.65);
              touch-action:none; cursor:pointer}
  .joybase.land-joy::before{content:""; position:absolute; inset:14px; border-radius:999px;
              border:1px dashed rgba(152,164,185,.28)}
  .joybase.land-joy .joynub{ width:68px; height:68px }

  .land-screen-bezel{background:#0f1116;border-radius:18px;padding:12px;
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.05), inset 0 0 28px rgba(0,0,0,.75);}
  .land-screen{ background:#141824; border-radius:12px; padding:8px; box-shadow: inset 0 0 24px rgba(0,0,0,.55); }
  #landScreenBox{ border:1px solid #2a2a2a; border-radius:8px; overflow:hidden; background:#20314f;
    display:flex; justify-content:center; align-items:center; }
  /* Cap the WIDTH (not the height) so the canvas keeps its 3:2 ratio:
     width:100% + height:auto + a max-height clamp squishes the picture
     (height gets capped while width stays wide). (100dvh-210px)*1.5 is the
     widest 3:2 box that still fits vertically. */
  #landScreenBox #game{ max-width: calc((100dvh - 210px) * 1.5); }

  /* Pressed-button feedback */
  .actCluster .btn.pressed, .ab .btn.pressed{ filter:brightness(1.45); }
  .tiny.pressed{ filter:brightness(1.7); }

  /* START/SELECT captions */
  .pillWrap{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .pillWrap span{ font-size:10px; letter-spacing:.1em; color:#aeb9d6; font-weight:700; text-transform:uppercase; }

  /* Compact landscape for short phone screens */
  @media (orientation: landscape) and (max-height: 520px){
    .gba-body{ padding:10px; border-radius:28px; margin:6px auto; }
    .gba-topbar{ margin-bottom:6px; }
    .gba-tray{ padding:8px; border-radius:20px; }
    #landscapeRow{ grid-template-columns: 120px 1fr 112px; gap:8px; }
    .joybase.land-joy{ width:120px; height:120px; }
    .joybase.land-joy::before{ inset:10px; }
    .joybase.land-joy .joynub{ width:46px; height:46px; }
    .land-actions{ gap:8px; }
    .land-actions .ab{ width:112px; height:96px; }
    .land-actions .ab .btn{ width:44px; height:44px; font-size:13px; }
    #landScreenBox #game{ max-width: calc((100dvh - 150px) * 1.5); }
  }

  .land-actions{ display:flex; flex-direction:column; align-items:center; gap:14px; }
  .land-actions .ab{ position:relative; width:160px; height:132px; }
  .land-actions .ab .btn{ position:absolute; width:60px; height:60px; border-radius:999px; border:1px solid #1b2a52; color:#e9f1ff; font-weight:800; font-size:16px; box-shadow:inset 0 8px 18px rgba(0,0,0,.45); touch-action:manipulation }
  #lA{ background:var(--btnA); right:6px; top:6px }
  #lB{ background:var(--btnB); left:14px; bottom:8px }
  .land-actions .start{ display:flex; gap:10px; }
  .land-actions .start .tiny{ min-width:auto; width:72px; height:32px; border-radius:999px; background:var(--btnStart); border:1px solid #222; color:white; font-weight:800; font-size:12px; touch-action:manipulation }

  /* ===== Mode switching ===== */
  /* GBA landscape shell: phones/tablets in landscape. The width cap covers
     small phones; pointer:coarse covers big phones (Pro Max landscape is
     956px wide, past the old 940px cap). */
  @media (orientation: landscape) and (max-width: 940px),
         (orientation: landscape) and (pointer: coarse){
    .gbc-shell{ display:none !important; }
    .gba-shell{ display:block; }
  }
  /* Desktop / mouse-driven: GBC shell, no touch buttons */
  @media (min-width: 941px) and (orientation: portrait),
         (min-width: 941px) and (pointer: fine){
    .gba-shell{ display:none !important; }
    #mobileControls{ display:none; }
  }
</style>
</head>
<body>
  <!-- PORTRAIT -->
  <div class="gbc-shell">
    <div class="gbc-face">
      <div class="topbar">
        <span>TRAILBOUND</span>
        <span class="power"><span class="led"></span>POWER</span>
      </div>
      <div class="gb-screen">
        <div id="canvasBox">
          <canvas id="game" width="960" height="640"></canvas>
        </div>
      </div>
      <div id="mobileControls">
        <div class="joybase" id="joyBase"><div class="joynub" id="joyNub"></div></div>
        <div></div>
        <div class="actCluster">
          <button class="btn" id="btnA">A</button>
          <button class="btn" id="btnB">B</button>
        </div>
        <div></div>
        <div class="startRow">
          <div class="pillWrap"><button class="tiny" id="btnStart">START</button><span>whistle</span></div>
          <div class="pillWrap"><button class="tiny" id="btnSelect">SELECT</button><span>stick</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- LANDSCAPE -->
  <div class="gba-shell">
    <div class="gba-body">
      <div class="topbar gba-topbar">
        <span>TRAILBOUND</span>
        <span class="power"><span class="led"></span>POWER</span>
      </div>
      <div class="gba-tray">
        <div id="landscapeRow">
          <!-- Joystick -->
          <div class="joybase land-joy" id="lJoyBase"><div class="joynub" id="lJoyNub"></div></div>
          <!-- Screen -->
          <div class="land-screen-bezel">
            <div class="land-screen">
              <div id="landScreenBox"></div>
            </div>
          </div>
          <!-- Actions -->
          <div class="land-actions">
            <div class="ab">
              <button class="btn" id="lA">A</button>
              <button class="btn" id="lB">B</button>
            </div>
            <div class="start">
              <div class="pillWrap"><button class="tiny" id="lStart">START</button><span>whistle</span></div>
              <div class="pillWrap"><button class="tiny" id="lSelect">SELECT</button><span>stick</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

<script>
/*__GAME_JS__*/

/* ===== SHELL: wire the physical buttons to the game's real inputs =====
   Joystick -> game 'joy' analog vector (move, incl. diagonals)
   A -> Space (act / menus) | B -> Tab (swap)
   START -> F (whistle) | SELECT -> X (throw stick) */
(function () {
  var KEY_FOR = { A: ' ', B: 'Tab', Start: 'f', Select: 'x' };
  function gameKey(name, type) {
    var e;
    try {
      e = new KeyboardEvent(type, { key: KEY_FOR[name], bubbles: true, cancelable: true });
    } catch (err) {
      e = document.createEvent('Event');
      e.initEvent(type, true, true);
      e.key = KEY_FOR[name];
    }
    window.dispatchEvent(e);
  }
  function bindBtn(id, name) {
    var el = document.getElementById(id);
    if (!el) return;
    var down = function (ev) { ev.preventDefault(); el.classList.add('pressed'); gameKey(name, 'keydown'); };
    var up = function (ev) { ev.preventDefault(); el.classList.remove('pressed'); gameKey(name, 'keyup'); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
    el.addEventListener('mouseleave', up);
    el.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
  }
  bindBtn('btnA', 'A'); bindBtn('btnB', 'B');
  bindBtn('btnStart', 'Start'); bindBtn('btnSelect', 'Select');
  bindBtn('lA', 'A'); bindBtn('lB', 'B');
  bindBtn('lStart', 'Start'); bindBtn('lSelect', 'Select');

  /* Analog joysticks: drag the nub to move. Writes the game's own 'joy'
     vector (joy.dx / joy.dy, -1..1), which the engine already merges with
     keyboard input and normalizes — so diagonals move at full speed and
     tilt controls speed. Dead zone 18% of travel; knob clamps to the rim.
     Pointer capture keeps the drag alive over other fingers pressing A/B. */
  var joySticks = [];
  function bindJoystick(baseId, nubId) {
    var base = document.getElementById(baseId);
    var nub = document.getElementById(nubId);
    if (!base || !nub || typeof joy === 'undefined') return;
    var pid = null, cx = 0, cy = 0, maxR = 40;
    function reset() {
      if (pid === null) return;
      pid = null;
      joy.id = null; joy.dx = 0; joy.dy = 0;
      nub.style.transform = '';
      base.classList.remove('active');
    }
    function center() {
      var r = base.getBoundingClientRect();
      cx = r.left + r.width / 2; cy = r.top + r.height / 2;
      maxR = Math.max(20, (r.width - nub.offsetWidth) / 2 - 4);
    }
    function update(ev) {
      var dx = ev.clientX - cx, dy = ev.clientY - cy;
      var dist = Math.hypot(dx, dy);
      if (dist > maxR) { dx = dx / dist * maxR; dy = dy / dist * maxR; dist = maxR; }
      var dead = maxR * 0.18;
      if (dist < dead) { joy.dx = 0; joy.dy = 0; }
      else {
        var tilt = (dist - dead) / (maxR - dead);
        joy.dx = dx / dist * tilt; joy.dy = dy / dist * tilt;
      }
      nub.style.transform = 'translate(-50%,-50%) translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    }
    base.addEventListener('pointerdown', function (ev) {
      if (pid !== null || joy.id !== null) return;
      ev.preventDefault();
      center();
      pid = ev.pointerId;
      joy.id = ev.pointerId; joy.dx = 0; joy.dy = 0;
      base.classList.add('active');
      try { base.setPointerCapture(ev.pointerId); } catch (err) {}
      update(ev);
    });
    base.addEventListener('pointermove', function (ev) {
      if (ev.pointerId !== pid) return;
      ev.preventDefault();
      update(ev);
    });
    base.addEventListener('pointerup', function (ev) { if (ev.pointerId === pid) reset(); });
    base.addEventListener('pointercancel', function (ev) { if (ev.pointerId === pid) reset(); });
    base.addEventListener('lostpointercapture', function (ev) { if (ev.pointerId === pid) reset(); });
    base.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });
    joySticks.push({ reset: reset });
  }
  bindJoystick('joyBase', 'joyNub');
  bindJoystick('lJoyBase', 'lJoyNub');
  /* Kill any stuck tilt on resize / rotate / tab hide / window blur */
  function resetAllJoy() {
    if (typeof joy !== 'undefined' && joy.id !== null) { joy.id = null; joy.dx = 0; joy.dy = 0; }
    joySticks.forEach(function (s) { s.reset(); });
  }
  window.addEventListener('resize', resetAllJoy);
  window.addEventListener('orientationchange', resetAllJoy);
  window.addEventListener('blur', resetAllJoy);
  document.addEventListener('visibilitychange', function () { if (document.hidden) resetAllJoy(); });

  /* One canvas, two screens: move it into whichever shell is visible.
     Mirrors the CSS: landscape when (landscape and narrow) or (landscape and touch). */
  var portraitBox = document.getElementById('canvasBox');
  var landBox = document.getElementById('landScreenBox');
  function shellIsLandscape() {
    return window.matchMedia('(orientation: landscape) and (max-width: 940px)').matches ||
           window.matchMedia('(orientation: landscape) and (pointer: coarse)').matches;
  }
  function setModeFromMedia() {
    var target = shellIsLandscape() ? landBox : portraitBox;
    if (canvas.parentElement !== target) target.appendChild(canvas);
  }
  setModeFromMedia();
  window.addEventListener('resize', setModeFromMedia);
  window.addEventListener('orientationchange', setModeFromMedia);
})();
</script>
</body>
</html>
